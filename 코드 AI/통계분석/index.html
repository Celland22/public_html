<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Tetris - 네온 테트리스</title>
    <meta name="description" content="모던 네온 스타일의 반응형 HTML5 테트리스 게임">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="game-header">
        <h1 class="game-title">
            <span>CYBER</span>
            <span>TETRIS</span>
        </h1>
        <p class="game-subtitle">Modern Cyberpunk Arcade Edition</p>
    </header>

    <main class="tetris-container">
        <!-- 좌측 패널: 스코어 및 레벨 정보 -->
        <aside class="panel left-panel">
            <div class="stat-box">
                <div class="stat-label">SCORE</div>
                <div id="scoreDisplay" class="stat-value highlight-cyan">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">HIGH SCORE</div>
                <div id="highScoreDisplay" class="stat-value highlight-yellow">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">LEVEL</div>
                <div id="levelDisplay" class="stat-value highlight-purple">1</div>
                <div class="level-progress-wrapper" title="다음 레벨까지 남은 라인">
                    <div id="levelProgress" class="level-progress-bar"></div>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-label">LINES CLEARED</div>
                <div id="linesDisplay" class="stat-value">0</div>
            </div>

            <div class="action-buttons">
                <button id="soundBtn" class="btn btn-secondary active">🔊 소리 켜짐</button>
            </div>
        </aside>

        <!-- 중앙 패널: 게임 보드 -->
        <section class="board-wrapper">
            <div class="board-container">
                <canvas id="tetrisBoard"></canvas>

                <!-- 일시정지 오버레이 -->
                <div id="pauseOverlay" class="overlay">
                    <h2 class="overlay-title pause-text">PAUSED</h2>
                    <p class="overlay-desc">게임이 일시정지되었습니다.<br>'P'키나 아래 버튼을 눌러 재개하세요.</p>
                    <button id="resumeBtn" class="btn btn-primary">계속하기 (Resume)</button>
                </div>

                <!-- 게임 오버 오버레이 -->
                <div id="gameOverOverlay" class="overlay">
                    <h2 class="overlay-title game-over-text">GAME OVER</h2>
                    <p class="overlay-desc">블록이 꼭대기에 도달했습니다!</p>
                    
                    <div class="overlay-score-summary">
                        <div class="summary-item">
                            <span>최종 점수</span>
                            <span id="finalScore">0</span>
                        </div>
                        <div class="summary-item">
                            <span>제거한 라인</span>
                            <span id="finalLines">0</span>
                        </div>
                        <div class="summary-item">
                            <span>도달 레벨</span>
                            <span id="finalLevel">1</span>
                        </div>
                    </div>

                    <button id="playAgainBtn" class="btn btn-primary">다시 플레이 (Play Again)</button>
                </div>
            </div>
        </section>

        <!-- 우측 패널: 다음 블록, 홀드 및 컨트롤 안내 -->
        <aside class="panel right-panel">
            <div class="preview-card">
                <div class="stat-label">NEXT</div>
                <div class="preview-canvas-container">
                    <canvas id="nextCanvas"></canvas>
                </div>
            </div>

            <div class="preview-card">
                <div class="stat-label">HOLD</div>
                <div class="preview-canvas-container">
                    <canvas id="holdCanvas"></canvas>
                </div>
            </div>

            <div class="controls-guide">
                <div class="controls-guide-title">조작 방법</div>
                <div class="control-item">
                    <span>좌우 이동</span>
                    <span class="key-badge">← →</span>
                </div>
                <div class="control-item">
                    <span>회전</span>
                    <span class="key-badge">↑</span>
                </div>
                <div class="control-item">
                    <span>소프트 드롭</span>
                    <span class="key-badge">↓</span>
                </div>
                <div class="control-item">
                    <span>하드 드롭</span>
                    <span class="key-badge">Space</span>
                </div>
                <div class="control-item">
                    <span>블록 홀드</span>
                    <span class="key-badge">C / Shift</span>
                </div>
                <div class="control-item">
                    <span>일시 정지</span>
                    <span class="key-badge">P / Esc</span>
                </div>
            </div>

            <div class="action-buttons">
                <button id="startRestartBtn" class="btn btn-primary">새 게임 (Restart)</button>
                <button id="pauseBtn" class="btn btn-secondary">일시정지 (Pause)</button>
            </div>
        </aside>
    </main>

    <!-- 모바일 / 터치 지원 컨트롤 -->
    <div class="touch-controls">
        <div class="touch-btn-group">
            <button id="touchRotate" class="touch-btn" aria-label="회전">↻</button>
            <button id="touchDrop" class="touch-btn" aria-label="하드 드롭">⤓</button>
        </div>
        <div class="touch-btn-group">
            <button id="touchLeft" class="touch-btn" aria-label="왼쪽">←</button>
            <button id="touchDown" class="touch-btn" aria-label="소프트 드롭">↓</button>
            <button id="touchRight" class="touch-btn" aria-label="오른쪽">→</button>
        </div>
    </div>

    <!-- 스크립트 연결 -->
    <script src="audio.js"></script>
    <script src="tetris.js"></script>
</body>
</html>
