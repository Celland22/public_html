"수요보다 많이 발주하면 재고가 남습니다. 신선식품은 오래 보관하기 어려워서 남은 물량이 폐기로 이어지고, 결국 원가 손실이 발생합니다.",
"반대로 적게 발주하면 재고가 먼저 떨어집니다. 고객이 구매하려 해도 판매할 수 없기 때문에 매출뿐 아니라 이익을 얻을 기회까지 놓치게 됩니다.",
"현재 발주는 시스템의 수요 예측값에 12퍼센트를 더하는 방식입니다. 하지만 프로모션이나 명절에 수요가 급증하면, 이 단순한 규칙만으로는 필요한 물량을 맞추기 어렵습니다.",
"발주량을 결정할 때는 폐기로 잃는 원가만 볼 수 없습니다. 재고가 부족해서 놓치는 판매 이익도 함께 고려해야 합니다. 두 손실을 함께 줄이는 것이 목표입니다.",
"그렇다면 어떻게 해결할 수 있을까요? 수요를 더 정확하게 예측하고, Newsvendor 모형으로 폐기 비용과 품절로 인한 기회손실을 함께 고려해 발주량을 정하는 것이 한 가지 방향입니다. 과연 두 문제를 동시에 줄일 수 있을까요?"];
const NM=["시간 압박","과잉·폐기","과소·품절","+12% 한계","두 손실","실마리"];

/* ---------- 재생 제어 (논리적 currentTime 하나로 모든 화면 계산) ---------- */
const cap=$("cap"),go=$("go"),ps=$("ps"),st=$("st"),mu=$("mu"),fil=$("fil"),tm=$("tm"),trk=$("trk");
let t=0,play=false,ended=false,cur=-1,last=0,prev=0,muted=false,ac=null,out=null,mus=null;
const nav=NM.map((n,i)=>{const b=document.createElement("button");b.type="button";b.textContent="0"+(i+1)+" "+n;b.onclick=()=>seek(i*5);$("nav").appendChild(b);return b});
for(let k=1;k<6;k++){const i=document.createElement("i");i.style.left=k/6*100+"%";trk.appendChild(i)}
const f2=x=>"00:"+String(Math.floor(x)).padStart(2,"0");
function render(){const i=Math.min(5,Math.floor(t/5)),l=t-i*5;
 if(i!==cur){const was=cur;cur=i;sc.forEach((s,k)=>s.g.style.display=k===i?"":"none");nav.forEach((b,k)=>b.classList.toggle("on",k===i));
  cap.classList.remove("sw");void cap.offsetWidth;cap.textContent=CAP[i];cap.classList.add("sw");if(play&&was>=0)blip()}
 sc[i].up(!play&&i===0&&l<.05?2.6:l);sc[i].g.style.opacity=i<5?1-pr(l,4.7,5):1;
 fil.style.width=t/30*100+"%";tm.textContent=f2(t)+" / 00:30"}
function ui(){go.disabled=play;ps.disabled=!play;go.textContent=ended?"▶ 다시 시작":"▶ 시작"}
function tick(n){if(!play)return;prev=t;t+=Math.min(.1,(n-last)/1000);last=n;
 if(prev<27.6&&t>=27.6)chime();
 if(t>=30){t=30;play=false;ended=true;render();ui();vol(0,2.5);return}
 render();requestAnimationFrame(tick)}
function start(){if(play)return;boot();if(ended||t>=30){t=0;ended=false;cur=-1}play=true;last=performance.now();vol(1,1);ui();requestAnimationFrame(tick)}
function pause(){if(!play)return;play=false;vol(0,.5);ui()}
function stop(){play=false;ended=false;t=0;cur=-1;vol(0,.3);render();ui()}
function seek(s){play=false;ended=false;t=s;cur=-1;vol(0,.3);render();ui()}
go.onclick=start;ps.onclick=pause;st.onclick=stop;
mu.onclick=()=>{muted=!muted;mu.setAttribute("aria-pressed",muted);mu.textContent=muted?"음소거됨":"소리 켜짐";if(out)out.gain.setTargetAtTime(muted?0:1,ac.currentTime,.05)};
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="BUTTON"){e.preventDefault();play?pause():start()}
 else if(/^[1-6]$/.test(e.key))seek((+e.key-1)*5);else if(e.key==="Escape")stop()});

/* ---------- 오디오 : Web Audio 합성 (외부 파일 없음) ---------- */
function boot(){if(ac){if(ac.state==="suspended")ac.resume();return}
 try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();out=ac.createGain();out.gain.value=muted?0:1;out.connect(ac.destination);
  mus=ac.createGain();mus.gain.value=0;mus.connect(out);const lf=ac.createBiquadFilter();lf.type="lowpass";lf.frequency.value=780;const pd=ac.createGain();pd.gain.value=.07;lf.connect(pd);pd.connect(mus);
  [[110,"sine",-3],[164.81,"sine",4],[220,"triangle",-5],[277.18,"sine",3],[329.63,"sine",-2]].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type=f[1];o.frequency.value=f[0];o.detune.value=f[2];g.gain.value=f[0]<200?1:.55;o.connect(g);g.connect(lf);o.start()});
  const L=ac.createOscillator(),lg=ac.createGain();L.frequency.value=.08;lg.gain.value=220;L.connect(lg);lg.connect(lf.frequency);L.start();if(ac.state==="suspended")ac.resume()}catch(e){ac=null}}
function vol(v,s){if(!ac||!mus)return;const n=ac.currentTime;mus.gain.cancelScheduledValues(n);mus.gain.setValueAtTime(mus.gain.value,n);mus.gain.linearRampToValueAtTime(v,n+s)}
function tone(f0,f1,d,v,at=0){if(!ac)return;const n=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+d);
 g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.1);g.gain.exponentialRampToValueAtTime(.0005,n+d+.2);o.connect(g);g.connect(out);o.start(n);o.stop(n+d+.25)}
const blip=()=>tone(440,660,.5,.05),chime=()=>{tone(659,659,1.6,.035);tone(988,988,1.6,.03,.12)};

render();ui();
